<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock-Paper-Scissor</title>
    <link rel="styleSheet" href="style.css">
</head>

<body>
    <h1>Rock Paper Scissors</h1>
    <p id="usermsg"></p>
    <p id="compmsg"></p>
    <div id="container">
        <div class="choice">
            <img class="icon" id="rock" src="rock.png" alt="Rock">
        </div>
        <div class="choice">
            <img class="icon" id="paper" src="paper.png" alt="Paper">
        </div>
        <div class="choice">
            <img class="icon" id="scissor" src="scissors.png" alt="Scissors">
        </div>
    </div>
    <div id="score-board">
        <div class="score">
            <p id="user">0</p>
            <p>you</p>
        </div>
        <div class="score">
            <p id="computer">0</p>
            <p>com</p>
        </div>
    </div>
    <div id="msg">
        <p>Play Your Move</p>
    </div>
    <script src="script.js"></script>
</body>

</html>
